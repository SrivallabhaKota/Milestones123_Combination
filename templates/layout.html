<!DOCTYPE html>
<!--
  FinSight – layout.html
  Base Jinja2 Template  |  All pages extend this
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FinSight – Personal Finance Platform. Track expenses, manage budgets, and achieve your financial goals." />
  <meta name="keywords"    content="finance, budget, expense tracker, savings, FinSight" />
  <meta name="author"      content="FinSight" />

  <title>{% block title %}FinSight{% endblock %} | Personal Finance</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/logo.jpeg') }}" />

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Custom Cursor Ring (circle only, no dot) -->
  <div id="cursor-ring" aria-hidden="true"></div>

  <!-- Main Content -->
  {% block content %}{% endblock %}

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFGKwHdHnfVSFLjEfHMPpoNWMlF"
          crossorigin="anonymous"></script>

  <!-- Custom JS -->
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
